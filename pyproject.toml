[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyVmafPlus"
version = "1.0.0"
description = "FFmpeg-based VMAF computation with automatic deinterlacing, scaling and sync, and hardware accelerated decoding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "ffmpeg-progress-yield>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
easyVmafPlus = "easyVmafPlus.cli:main"

[tool.setuptools.packages.find]
include = ["easyVmafPlus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
