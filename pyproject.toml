[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyVmafPlus"
version = "1.0.0"
description = "FFmpeg-based VMAF computation with automatic deinterlacing, scaling and sync, and hardware accelerated decoding"
readme = "README.md"
license = "MIT AND BSD-2-Clause-Patent"
license-files = ["LICENSE", "easyVmafPlus/models/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-progress-yield>=0.7.0",
    "matplotlib>=3.11",
    "numpy>=2.4",
    "pillow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
easyVmafPlus = "easyVmafPlus.cli:main"
easyVmafPlusPlot = "easyVmafPlus.plot:main"

[tool.setuptools.packages.find]
include = ["easyVmafPlus*"]

[tool.setuptools.package-data]
easyVmafPlus = ["models/LICENSE", "models/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
